plugins {
    id 'com.android.library'
    id 'org.jetbrains.kotlin.android'
}

android {
    namespace 'com.wavelens.sdk'
    compileSdk 34
    ndkVersion '27.0.12077973'

    defaultConfig {
        minSdk 24

        externalNativeBuild {
            cmake {
                cppFlags '-std=c++17'
                arguments '-DANDROID_STL=c++_static'
            }
        }
        ndk {
            // x86_64 kept for emulator development; drop it for the smallest tenant AAR.
            abiFilters 'armeabi-v7a', 'arm64-v8a', 'x86_64'
        }
        consumerProguardFiles 'consumer-rules.pro'
    }

    externalNativeBuild {
        cmake {
            path file('../../engine/CMakeLists.txt')
            version '3.22.1'
        }
    }

    buildTypes {
        release {
            minifyEnabled false
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    kotlinOptions {
        jvmTarget = '17'
    }

    packagingOptions {
        jniLibs {
            // Strip debug symbols from the shipped .so
            keepDebugSymbols += []
        }
    }
}

dependencies {
    implementation 'androidx.core:core-ktx:1.13.1'
    implementation 'androidx.camera:camera-core:1.3.4'
    implementation 'androidx.camera:camera-camera2:1.3.4'
    implementation 'androidx.camera:camera-lifecycle:1.3.4'
    // On-device face detection for face-anchored AR filters (bundled model,
    // no Play Services download needed; adds ~1 MB to the AAR consumer app).
    api 'com.google.mlkit:face-detection:16.1.7'
}
