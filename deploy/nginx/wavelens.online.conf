# Static marketing site → wavelens.online
# Copy to: /etc/nginx/sites-available/wavelens.online
# Enable: ln -sf /etc/nginx/sites-available/wavelens.online /etc/nginx/sites-enabled/

server {
    listen 80;
    server_name wavelens.online;

    root /var/www/wavelens-website;
    index index.html;

    location / {
        try_files $uri $uri/ /index.html;
    }

    location ~* \.(css|js|svg|png|jpg|webp|woff2|ico|txt|xml)$ {
        expires 7d;
        add_header Cache-Control "public";
    }
}
