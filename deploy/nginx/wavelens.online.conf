# Static marketing site → wavelens.online
# Files: /var/www/wavelens-website (deploy.sh copies website/ there)
#
# Setup (once):
#   bash deploy/setup-nginx.sh
#   certbot --nginx -d wavelens.online -d www.wavelens.online
#
# wavelens.online = static HTML only.
# api.wavelens.online = NestJS license API (:5000)

server {
    listen 80;
    listen [::]:80;
    server_name wavelens.online www.wavelens.online;

    root /var/www/wavelens-website;
    index index.html;

    # HTML — always revalidate (deploy updates show immediately)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # CSS / JS — short cache (deploy adds ?v=gitsha query string)
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    # Images / fonts — longer cache OK
    location ~* \.(svg|png|jpg|jpeg|webp|woff2|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}

# certbot adds HTTPS block. After certbot, ensure the :443 block uses the same
# cache rules above (copy from this file if certbot overwrote them).
