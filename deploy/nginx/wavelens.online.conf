# Static marketing site → wavelens.online
# Files: /var/www/wavelens-website (deploy.sh copies website/ there)
#
# Setup (once on server):
#   bash deploy/setup-nginx.sh
#   certbot certonly --webroot -w /var/www/wavelens-website \
#     -d wavelens.online -d www.wavelens.online
#   nginx -t && systemctl reload nginx
#
# Or: npm run deploy (syncs this file + renews certs automatically)

server {
    listen 80;
    listen [::]:80;
    server_name wavelens.online www.wavelens.online;

    root /var/www/wavelens-website;
    index index.html;

    # Let's Encrypt HTTP-01 (certbot webroot / renew)
    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name wavelens.online www.wavelens.online;

    ssl_certificate     /etc/letsencrypt/live/wavelens.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/wavelens.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    root /var/www/wavelens-website;
    index index.html;

    # HTML — always revalidate (deploy updates show immediately)
    location ~* \.html$ {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files $uri =404;
    }

    location = / {
        add_header Cache-Control "no-cache, must-revalidate";
        try_files /index.html =404;
    }

    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-cache, must-revalidate";
    }

    # CSS / JS — short cache (deploy adds ?v=gitsha query string)
    location ~* \.(css|js)$ {
        expires 1h;
        add_header Cache-Control "public, max-age=3600, must-revalidate";
        try_files $uri =404;
    }

    # Images / fonts — longer cache OK
    location ~* \.(svg|png|jpg|jpeg|webp|woff2|ico)$ {
        expires 30d;
        add_header Cache-Control "public, max-age=2592000, immutable";
        try_files $uri =404;
    }
}
