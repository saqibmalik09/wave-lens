# Wave Lens license API → api.wavelens.online → localhost:5000
# Copy to: /etc/nginx/sites-available/api.wavelens.online
# Enable: ln -sf /etc/nginx/sites-available/api.wavelens.online /etc/nginx/sites-enabled/
#
# Does NOT touch your other services:
#   Laravel  → port 8000 (separate server_name)
#   Other NestJS → port 3000 (separate server_name)
#   Wave Lens API → port 5000 (this file only)

server {
    listen 80;
    server_name api.wavelens.online;

    location / {
        proxy_pass http://127.0.0.1:5000;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 60s;
        proxy_read_timeout 60s;
    }
}
