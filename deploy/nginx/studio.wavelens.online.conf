# Studio dashboard → studio.wavelens.online
# Next.js on port 3001 (pm2: wavelens-studio)
#
# After copying, run:
#   certbot --nginx -d studio.wavelens.online
# Certbot adds SSL lines to the :443 block below.
# Port 80 should redirect to HTTPS.

server {
    listen 80;
    listen [::]:80;
    server_name studio.wavelens.online;

    location ^~ /.well-known/acme-challenge/ {
        allow all;
        default_type "text/plain";
        root /var/www/html;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl http2;
    listen [::]:443 ssl http2;
    server_name studio.wavelens.online;

    # Certbot fills these (or run: certbot --nginx -d studio.wavelens.online)
    ssl_certificate     /etc/letsencrypt/live/studio.wavelens.online/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studio.wavelens.online/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location / {
        proxy_pass http://127.0.0.1:3001;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection 'upgrade';
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_cache_bypass $http_upgrade;
    }
}
