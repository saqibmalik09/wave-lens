# Studio dashboard placeholder → studio.wavelens.online
# Copy to: /etc/nginx/sites-available/studio.wavelens.online
# When the Next.js dashboard is ready, change proxy_pass to port 3001.

server {
    listen 80;
    server_name studio.wavelens.online;

    root /var/www/wavelens-website;
    index coming-soon.html;

    location / {
        try_files /coming-soon.html =404;
    }
}
